name: query-review
services:
  db:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-query-review}-db
    environment:
      POSTGRES_DB: query_review
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_demo_4101}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-local_repl_4101}
    ports: ["${DB_PORT:-17740}:5432"]
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./backend/scripts/db-init-replication.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d query_review"]
      interval: 3s
      timeout: 3s
      retries: 30
  db-replica:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-query-review}-db-replica
    entrypoint: ["/replica-entrypoint.sh"]
    user: root
    environment:
      PRIMARY_HOST: db
      REPLICATION_USER: replicator
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-local_repl_4101}
      REPLICA_DIR: /var/lib/postgresql/replica
    volumes:
      - ./backend/scripts/replica-entrypoint.sh:/replica-entrypoint.sh:ro
      - replica-data:/var/lib/postgresql/replica
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d query_review && psql -U postgres -d query_review -tAc 'SELECT pg_is_in_recovery()' | grep -q t"]
      interval: 3s
      timeout: 3s
      retries: 60
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-query-review}-redis
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-query-review}-backend
    environment: &app-env
      DATABASE_URL: postgresql+psycopg2://app:${POSTGRES_PASSWORD:-local_demo_4101}@db/query_review
      REDIS_URL: redis://redis:6379/0
      REPLICA_DATABASE_URL: postgresql+psycopg2://app:${POSTGRES_PASSWORD:-local_demo_4101}@db-replica/query_review
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-local_repl_4101}
      JWT_SECRET: ${JWT_SECRET:-local-demo-query-review-change-before-production-20261117}
      SEED_DEMO: ${SEED_DEMO:-true}
      FALLBACK_WAIT_SECONDS: ${FALLBACK_WAIT_SECONDS:-10}
    ports: ["${BACKEND_PORT:-19240}:8000"]
    volumes: ["artifacts:/artifacts"]
    # 副本故障不应阻止应用启动：批次会按规则回主库
    depends_on:
      db: {condition: service_healthy}
      db-replica: {condition: service_started}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 30
  worker:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-query-review}-worker
    environment: *app-env
    command: ["python", "-u", "-m", "src.worker"]
    volumes: ["artifacts:/artifacts"]
    depends_on:
      db: {condition: service_healthy}
      db-replica: {condition: service_started}
      redis: {condition: service_healthy}
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,time; assert time.time()-float(pathlib.Path('/artifacts/worker.heartbeat').read_text())<20"]
      interval: 3s
      timeout: 3s
      retries: 20
  frontend:
    build: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-query-review}-frontend
    ports: ["${FRONTEND_PORT:-18240}:80"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  db-data:
  replica-data:
  redis-data:
  artifacts:
